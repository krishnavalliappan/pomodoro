name: Pomodoro
options:
  bundleIdPrefix: dev.krishna
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  PomodoroCore:
    path: Packages/PomodoroCore
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

targets:
  Pomodoro:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: PomodoroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.krishna.pomodoro
        PRODUCT_NAME: Pomodoro
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pomodoro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    scheme:
      testTargets:
        - PomodoroTests

  PomodoroTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PomodoroTests
    dependencies:
      - target: Pomodoro
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.krishna.pomodoro.tests
        GENERATE_INFOPLIST_FILE: YES
