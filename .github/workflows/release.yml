name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload the zip as an artifact without publishing a GitHub Release
        type: boolean
        default: true
  # A workflow can't be dispatched until it's on main, so PRs that touch the release path
  # exercise it as a dry run.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - project.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "26.6"
  DERIVED_DATA: build/DerivedData

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Resolve version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          declared=$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?$/\1/p' project.yml)
          core=$(sed -nE 's/.*static let current = Version\(major: ([0-9]+), minor: ([0-9]+), patch: ([0-9]+)\).*/\1.\2.\3/p' \
            Packages/PomodoroCore/Sources/PomodoroCore/Version.swift)
          echo "project.yml=$declared PomodoroCore=$core ref=$GITHUB_REF_TYPE/$GITHUB_REF_NAME dry_run=$DRY_RUN"
          # The About line reads Version.current, so all three must agree before anything ships.
          test -n "$declared" && test "$declared" = "$core"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "${GITHUB_REF_NAME#v}" = "$declared" || {
              echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $declared"; exit 1; }
            [ "$DRY_RUN" = true ] || publish=true
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # Same key as ci.yml, but restore-only: a release run never writes the shared cache.
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/SourcePackages
            Packages/PomodoroCore/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ env.XCODE_VERSION }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ env.XCODE_VERSION }}-

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Ad-hoc sign and verify
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/Pomodoro.app"
          PLIST="$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E '^(Identifier|Signature)='

          lsui=$(plutil -extract LSUIElement raw "$PLIST")
          short=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          build=$(plutil -extract CFBundleVersion raw "$PLIST")
          icon=$(plutil -extract CFBundleIconName raw "$PLIST")
          echo "LSUIElement=$lsui CFBundleShortVersionString=$short CFBundleVersion=$build CFBundleIconName=$icon"
          test "$lsui" = true || test "$lsui" = 1
          test "$short" = "${{ steps.version.outputs.version }}"
          test "$build" = "$GITHUB_RUN_NUMBER"
          test "$icon" = AppIcon
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/Assets.car"

      - name: Zip and checksum
        id: zip
        run: |
          name="Pomodoro-${{ steps.version.outputs.version }}.zip"
          mkdir -p build/release
          ditto -c -k --keepParent "$DERIVED_DATA/Build/Products/Release/Pomodoro.app" "build/release/$name"
          (cd build/release && shasum -a 256 "$name" > "$name.sha256" && cat "$name.sha256")
          unzip -l "build/release/$name" | tail -n 3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-${{ steps.version.outputs.version }}
          path: build/release
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pomodoro-${{ needs.build.outputs.version }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          shasum -a 256 -c "Pomodoro-$VERSION.zip.sha256"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pomodoro $VERSION" \
            --generate-notes \
            --notes "Ad-hoc signed, not notarized. After unzipping, run \`xattr -dr com.apple.quarantine Pomodoro.app\`, then move it to /Applications." \
            "Pomodoro-$VERSION.zip" "Pomodoro-$VERSION.zip.sha256"
