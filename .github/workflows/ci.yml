name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"
  DERIVED_DATA: build/DerivedData
  SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/snapshot-failures

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # .build holds compiled outputs, so the key must change with the runner image and arch.
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            Packages/PomodoroCore/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ env.XCODE_VERSION }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id }}-${{ env.XCODE_VERSION }}-

      - name: Test PomodoroCore
        run: swift test --package-path Packages/PomodoroCore

      - name: Build and test app
        run: |
          mkdir -p "$SNAPSHOT_ARTIFACTS"
          set -o pipefail
          TEST_RUNNER_SNAPSHOT_ARTIFACTS="$SNAPSHOT_ARTIFACTS" \
          TEST_RUNNER_OS_ACTIVITY_MODE=disable \
          xcodebuild \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Pomodoro.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            build test

      - name: Verify LSUIElement in built Info.plist
        run: |
          PLIST="$DERIVED_DATA/Build/Products/Debug/Pomodoro.app/Contents/Info.plist"
          value=$(plutil -extract LSUIElement raw "$PLIST")
          echo "LSUIElement=$value"
          test "$value" = "true" || test "$value" = "1"

      # SnapshotTesting only writes the actual render to SNAPSHOT_ARTIFACTS; the reference,
      # failure, and difference images are XCTest attachments inside the result bundle.
      - name: Collect snapshots
        if: always()
        run: |
          mkdir -p build/snapshots/reference build/snapshots/failures
          cp -R Snapshots/. build/snapshots/reference/ 2>/dev/null || true
          cp -R "$SNAPSHOT_ARTIFACTS"/. build/snapshots/failures/ 2>/dev/null || true
          if [ -d build/Pomodoro.xcresult ]; then
            raw=build/xcresult-attachments
            xcrun xcresulttool export attachments \
              --path build/Pomodoro.xcresult \
              --output-path "$raw" || echo "::warning::xcresulttool attachment export failed"
            if [ -f "$raw/manifest.json" ]; then
              # Lay files out as failures/<Class>/<test>/<attachment>.png so variants never collide.
              python3 - "$raw" build/snapshots/failures <<'PY'
          import json, os, re, shutil, sys
          raw, out = sys.argv[1], sys.argv[2]
          for test in json.load(open(os.path.join(raw, "manifest.json"))):
              ident = test.get("testIdentifier", "unknown").replace("()", "")
              dest = os.path.join(out, *[re.sub(r"[^A-Za-z0-9._-]", "_", p) for p in ident.split("/")])
              os.makedirs(dest, exist_ok=True)
              for a in test.get("attachments", []):
                  src = os.path.join(raw, a["exportedFileName"])
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  # Names look like "difference_0_<UUID>.png"; keep the readable prefix.
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(?=\.)", "", name)
                  shutil.copy(src, os.path.join(dest, name))
          PY
            fi
          fi
          find build/snapshots -type f | sort

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots
          if-no-files-found: warn

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Pomodoro.xcresult
          if-no-files-found: warn

      # Built on PRs too so Release-only failures surface before merge; only main uploads it.
      - name: Build Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project Pomodoro.xcodeproj \
            -scheme Pomodoro \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            build
          ditto -c -k --keepParent "$DERIVED_DATA/Build/Products/Release/Pomodoro.app" build/Pomodoro.app.zip

      - name: Upload app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro.app
          path: build/Pomodoro.app.zip
